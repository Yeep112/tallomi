<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tallomi 手機檢查</title>
<style>
body { font: 16px/1.6 system-ui, sans-serif; margin: 0; padding: 20px 18px 60px; background: #16233A; color: #fff; }
h1 { font-size: 22px; margin: 0 0 6px; }
p { margin: 8px 0; }
.dim { opacity: .75; font-size: 14px; }
button { font: inherit; padding: 12px 22px; border-radius: 10px; border: 0; background: #D9B45B; color: #16233A; font-weight: 700; margin: 8px 8px 8px 0; }
button.alt { background: #ffffff22; color: #fff; }
#log div { padding: 7px 0; border-bottom: 1px solid #ffffff22; word-break: break-all; }
.ok::before { content: "✓ "; color: #7CE0A0; } .bad::before { content: "✗ "; color: #FF8A8A; } .go::before { content: "… "; color: #D9B45B; }
#prev { background: #3A2C16; border-radius: 10px; padding: 10px 14px; margin: 14px 0; display: none; }
a { color: #9CC4FF; }
</style>
</head>
<body>
<h1>Tallomi 手機檢查</h1>
<p class="dim">這一頁會一步一步測試你的手機能不能跑 Tallomi 手機版，找出是哪一步出問題。每一步開始前都會先記下來，所以就算網頁被 iPhone 強制關掉，重新打開這一頁就能看到「上次停在哪一步」。</p>
<div id="prev"></div>
<div id="env" class="dim"></div>
<p><button id="go">開始檢查</button><button id="go2" class="alt">只檢查到「載入程式」（不啟動 Python）</button></p>
<div id="log"></div>
<p class="dim">檢查完請把整個畫面截圖給我。<a href="./">回到 Tallomi 手機版</a></p>
<script src="check.js"></script>
</body>
</html>
