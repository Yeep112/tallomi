<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tallomi 引擎測試</title>
<style>
body { font: 16px/1.6 system-ui, sans-serif; margin: 0; padding: 20px 18px 60px; background: #16233A; color: #fff; }
h1 { font-size: 22px; margin: 0 0 6px; }
p { margin: 8px 0; }
.dim { opacity: .75; font-size: 14px; }
button { font: inherit; padding: 12px 22px; border-radius: 10px; border: 0; background: #D9B45B; color: #16233A; font-weight: 700; margin: 8px 8px 8px 0; }
button.alt { background: #ffffff22; color: #fff; }
#log div { padding: 8px 0; border-bottom: 1px solid #ffffff22; word-break: break-all; }
.ok::before { content: "✓ "; color: #7CE0A0; } .bad::before { content: "✗ "; color: #FF8A8A; } .go::before { content: "… "; color: #D9B45B; } .todo::before { content: "· "; opacity: .6; }
#next { background: #3A2C16; border-radius: 10px; padding: 10px 14px; margin: 14px 0; display: none; }
a { color: #9CC4FF; }
</style>
</head>
<body>
<h1>Tallomi 引擎測試</h1>
<p class="dim">手機版用 Python 引擎（Pyodide）執行。你的 iPhone 在啟動目前這個版本時會被 Safari 強制關掉，所以這一頁依序試幾種不同版本，找出哪一個撐得住。</p>
<p class="dim">做法：按「開始測試」。如果 Safari 跳出「重複發生問題」，請重新打開這一頁（或按「重新載入」），再按「繼續測試」，它會記得哪些已經試過。</p>
<div id="env" class="dim"></div>
<div id="next"></div>
<p><button id="go">開始測試</button><button id="reset" class="alt">全部重來</button></p>
<div id="log"></div>
<p class="dim">試完請把整個畫面截圖給我。<a href="check.html">回到手機檢查</a>　<a href="./">回到 Tallomi 手機版</a></p>
<script src="engine.js"></script>
</body>
</html>
